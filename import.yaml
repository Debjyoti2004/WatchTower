services:
  - hostname: frontend
    type: nodejs@22
    enableSubdomainAccess: true

  - hostname: backend
    type: nodejs@22
    enableSubdomainAccess: true

  - hostname: worker
    type: nodejs@22

  - hostname: db
    type: postgresql@16
    mode: NON_HA

  - hostname: cache
    type: valkey@7.2
    mode: NON_HA

  - hostname: nats
    type: nats@2.10
    mode: NON_HA

  - hostname: storage
    type: object-storage
    objectStorageSize: 2