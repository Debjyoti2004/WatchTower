zerops:
  - setup: frontend
    build:
      base: nodejs@22
      buildCommands:
        - cd frontend-react && npm install && npm run build
      deployFiles: frontend-react/dist
    run:
      base: nodejs@22
      ports:
        - port: 3000
          httpSupport: true
      start: npx serve . -l 3000 -s
      envVariables:
        VITE_API_URL: ${BACKEND_URL}

  - setup: backend
    build:
      base: nodejs@22
      buildCommands:
        - cd backend-node && npm install
      deployFiles: backend-node
    run:
      base: nodejs@22
      ports:
        - port: 8000
          httpSupport: true
      start: node server.js
      envVariables:
        DATABASE_URL: ${db_connectionString}
        VALKEY_HOST:  ${cache_hostname}
        VALKEY_PORT:  ${cache_port}
        NATS_URL:     nats://${nats_hostname}:${nats_port}
        S3_ENDPOINT:  ${storage_apiUrl}
        S3_KEY:       ${storage_accessKeyId}
        S3_SECRET:    ${storage_secretAccessKey}
        S3_BUCKET:    ${storage_bucketName}
        GROQ_API_KEY: ${GROQ_API_KEY}
        PORT:         "8000"

  - setup: worker
    build:
      base: nodejs@22
      buildCommands:
        - cd worker-node && npm install
      deployFiles: worker-node
    run:
      base: nodejs@22
      start: echo "worker ready"
      crontab:
        - command: node poll.js
          timing: "*/30 * * * * *"
      envVariables:
        DATABASE_URL: ${db_connectionString}
        NATS_URL:     nats://${nats_hostname}:${nats_port}