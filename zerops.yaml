zerops:
  - setup: frontend
    build:
      base: nodejs@22
      buildCommands:
        - cd frontend && npm install && npm run build
      deployFiles: frontend/dist
      envVariables:
        VITE_API_URL: ${BACKEND_URL}
    run:
      base: nodejs@22
      ports:
        - port: 3000
          httpSupport: true
      start: npx serve . -l 3000 -s

  - setup: backend
    build:
      base: nodejs@22
      buildCommands:
        - cd backend && npm install
      deployFiles: backend
    run:
      base: nodejs@22
      ports:
        - port: 8000
          httpSupport: true
      healthCheck:
        httpGet:
          port: 8000
          path: /health
      start: node backend/server.js
      envVariables:
        DATABASE_URL:   ${db_connectionString}
        VALKEY_HOST:    ${cache_hostname}
        VALKEY_PORT:    ${cache_port}
        NATS_URL:       nats://${nats_hostname}:${nats_port}
        S3_ENDPOINT:    ${storage_apiUrl}
        S3_KEY:         ${storage_accessKeyId}
        S3_SECRET:      ${storage_secretAccessKey}
        S3_BUCKET:      ${storage_bucketName}
        GEMINI_API_KEY: ${GEMINI_API_KEY}
        PORT:           "8000"

  - setup: worker
    build:
      base: nodejs@22
      buildCommands:
        - cd worker && npm install
      deployFiles: worker
    run:
      base: nodejs@22
      start: echo "worker ready"
      crontab:
        - command: node worker/poll.js
          timing: "*/30 * * * * *"
      envVariables:
        DATABASE_URL: ${db_connectionString}
        NATS_URL:     nats://${nats_hostname}:${nats_port}